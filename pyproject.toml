[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-agent"
version = "0.1.0"
description = "Private resume ingestion and evidence-based job matching"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4", "celery>=5.4,<6", "redis>=5.2,<7",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "PyJWT>=2.10,<3",
  "langchain-core>=1,<2", "langchain-ollama>=1,<2", "langgraph==1.2.16", "pymilvus>=2.6,<2.7",
  "numpy>=1.26,<2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "Pillow==12.3.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

