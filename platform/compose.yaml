      CONSOLE_WEB_URL: http://127.0.0.1:18081
      CONSOLE_API_URL: http://127.0.0.1:18081
      APP_WEB_URL: http://127.0.0.1:18081
      APP_API_URL: http://127.0.0.1:18081
      SERVICE_API_URL: http://127.0.0.1:18081
      FILES_URL: http://127.0.0.1:18081
      INTERNAL_FILES_URL: http://dify-api:5001
      SERVER_WORKER_AMOUNT: '1'
      SERVER_WORKER_CONNECTIONS: '20'
      SQLALCHEMY_POOL_SIZE: '5'
      SQLALCHEMY_MAX_OVERFLOW: '5'
      CELERY_WORKER_AMOUNT: '1'
      CELERY_WORKER_CLASS: gevent
      GUNICORN_TIMEOUT: '1800'
      TEXT_GENERATION_TIMEOUT_MS: '1800000'
      APP_MAX_EXECUTION_TIME: '1800'
      WORKFLOW_MAX_EXECUTION_TIME: '1800'
      ENABLE_COLLABORATION_MODE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      ENABLE_EMAIL_PASSWORD_LOGIN: 'true'
    networks:
    - dify
    - egress
    depends_on:
      postgres:
        condition: service_healthy
      dify-redis:
        condition: service_healthy
    volumes:
    - dify-plugins:/app/storage
    - ./infra/dify/wheels:/offline-wheels:ro
  dify-agent-backend:
    image: langgenius/dify-agent-backend:1.17.1@sha256:a30c039bbead65d7fd8baf8c53fc867373f515c5721e46070ce03ed04c5f1e32
    restart: unless-stopped
    environment:
      DIFY_AGENT_REDIS_URL: redis://:${DIFY_REDIS_PASSWORD}@dify-redis:6379/2
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${DIFY_PLUGIN_KEY}
      DIFY_AGENT_INNER_API_URL: http://dify-api:5001
      DIFY_AGENT_INNER_API_KEY: ${DIFY_INNER_KEY}
      DIFY_AGENT_RUNTIME_BACKEND: ${DIFY_AGENT_RUNTIME_BACKEND:-local}
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://dify-local-sandbox:5004
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${DIFY_SHELL_TOKEN}
      DIFY_AGENT_STUB_API_BASE_URL: http://dify-agent-backend:5050/agent-stub
      DIFY_AGENT_SANDBOX_FILES_BASE_URL: http://dify-api:5001
      DIFY_AGENT_SERVER_SECRET_KEY: ${DIFY_AGENT_SECRET}
      DIFY_AGENT_API_TOKEN: ${DIFY_AGENT_API_TOKEN}
    networks:
      dify:
        aliases:
        - agent_backend
      dify-agent: {}
    depends_on:
      dify-redis:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
  dify-local-sandbox:
    image: langgenius/dify-agent-local-sandbox:1.17.1@sha256:f4d404c9dcdf80bd72f65e84c3f2bbd1f3404fd4b363db837176da8aaf771b1d
    restart: unless-stopped
    environment:
      SHELLCTL_AUTH_TOKEN: ${DIFY_SHELL_TOKEN}
      HTTP_PROXY: http://dify-agent-ssrf-proxy:3128
      HTTPS_PROXY: http://dify-agent-ssrf-proxy:3128
      NO_PROXY: localhost,127.0.0.1
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5004/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
    - dify-agent
    - dify-agent-proxy
    volumes:
    - dify-agent-home:/home/dify
    - dify-agent-workspace:/workspace
  dify-agent-ssrf-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    entrypoint:
    - sh
    - -c
    - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh\
      \ && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: dify-api,dify-agent-backend
    networks:
    - dify
    - dify-agent-proxy
    - egress
    volumes:
    - ./infra/dify/upstream/docker/ssrf_proxy/squid-agent.conf.template:/etc/squid/squid.conf.template:ro
    - ./infra/dify/upstream/docker/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
    - ./infra/dify/upstream/docker/ssrf_proxy/docker-agent-entrypoint.sh:/docker-entrypoint-mount.sh:ro
  dify-ssrf-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    entrypoint:
    - sh
    - -c
    - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh\
      \ && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: model-gateway,platform-api
    networks:
    - dify
    - dify-sandbox
    - egress
    - data
    volumes:
    - ./infra/dify/upstream/docker/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template:ro
    - ./infra/dify/upstream/docker/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template:ro
    - ./infra/dify/upstream/docker/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
  dify-nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    networks:
    - dify
    - application
    volumes:
    - ./infra/dify/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 127.0.0.1:18081:80
    depends_on:
      dify-api:
        condition: service_started
      dify-web:
        condition: service_started
      dify-api-websocket:
        condition: service_started
  milvus-init:
    image: talent-platform-api:0.2.0
    restart: 'no'
    command:
    - python
    - /bootstrap/init_milvus.py
    volumes:
    - ./infra/init_milvus.py:/bootstrap/init_milvus.py:ro
    networks:
    - data
    depends_on:
      milvus:
        condition: service_healthy
networks:
  data:
    internal: true
  application: {}
  dify:
    internal: true
  dify-sandbox:
    internal: true
  dify-agent:
    internal: true
  dify-agent-proxy:
    internal: true
  egress: {}
volumes:
  postgres: {}
  mysql: {}
  redis: {}
  etcd: {}
  minio: {}
  milvus: {}
  app-data: {}
  dify-redis: {}
  dify-storage: {}
  dify-sandbox-deps: {}
  dify-sandbox-conf: {}
  dify-plugins: {}
  dify-agent-home: {}
  dify-agent-workspace: {}
  mineru-models:
    external: true
    name: talent-agent_mineru-models
