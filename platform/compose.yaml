# Derived from official langgenius/dify tag 1.17.1; see infra/dify/upstream.
name: talent-platform
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25@sha256:52f17f7e56e4f7239f0320dbfcbcc24721163d7d78ae710b466af3254ccf6366
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '1073741824'
      ETCD_SNAPSHOT_COUNT: '50000'
    command:
    - etcd
    - -advertise-client-urls=http://etcd:2379
    - -listen-client-urls=http://0.0.0.0:2379
    - --data-dir=/etcd
    volumes:
    - etcd:/etcd
    networks:
    - data
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 15s
      timeout: 10s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z@sha256:391d1d45fdbe79944cb6de9337b073864bb9ee38c4c24280bfb39572e925af08
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-talentstorage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/start.ps1 first}
    command:
    - minio
    - server
    - /minio_data
    - --console-address
    - :9001
    volumes:
    - minio:/minio_data
    networks:
    - data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 15s
      timeout: 10s
      retries: 12
  milvus:
    image: milvusdb/milvus:v2.6.16@sha256:33a0f81a7343158a1c1e0454b151600074c34f561c069157712b930ca5ca1b04
    restart: unless-stopped
    command:
    - milvus
    - run
    - standalone
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-talentstorage}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/start.ps1 first}
      MINIO_REGION: us-east-1
      COMMON_STORAGETYPE: remote
      MQ_TYPE: rocksmq
    volumes:
    - milvus:/var/lib/milvus
    networks:
    - data
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 20
  mineru:
    image: talent-agent-mineru:4.0.12@sha256:294b3aa1183a728f474077f5223911e4f69e94847bddc9bbfd25c2c5dde55685
    restart: unless-stopped
    init: true
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_SMALL_BACKEND: onnx
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MINERU_DEVICE_MODE: cpu
    volumes:
    - mineru-models:/models:ro
    tmpfs:
    - /models/models/.locks:uid=10002,gid=10002,mode=0700
    networks:
    - data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health',timeout=5)
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 20
    mem_limit: 4g
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?initialize configuration}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?initialize configuration}
      CHECKPOINT_PASSWORD: ${CHECKPOINT_PASSWORD:?initialize configuration}
      ANALYSIS_PASSWORD: ${ANALYSIS_PASSWORD:?initialize configuration}
      DIFY_DB_PASSWORD: ${DIFY_DB_PASSWORD:?initialize configuration}
      DIFY_PLUGIN_DB_PASSWORD: ${DIFY_PLUGIN_DB_PASSWORD:?initialize configuration}
    volumes:
    - postgres:/var/lib/postgresql/data
    - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/20-platform.sh:ro
    networks:
    - data
    - dify
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 30
    command:
    - postgres
    - -c
    - max_connections=160
    - -c
    - shared_buffers=128MB
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?initialize configuration}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: talent
      MYSQL_USER: talent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?initialize configuration}
      MYSQL_ANALYSIS_PASSWORD: ${MYSQL_ANALYSIS_PASSWORD:?initialize configuration}
    volumes:
    - mysql:/var/lib/mysql
    - ./infra/mysql-init.sh:/docker-entrypoint-initdb.d/20-platform.sh:ro
    networks:
    - data
    command:
    - --innodb-buffer-pool-size=256M
    - --max-connections=100
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost --silent
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?initialize configuration}
    entrypoint:
    - /bin/sh
    - -c
    - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
      --requirepass "$$REDIS_PASSWORD"
    volumes:
    - redis:/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 12
  dify-redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DIFY_REDIS_PASSWORD:?initialize configuration}
    entrypoint:
    - /bin/sh
    - -c
    - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
      --requirepass "$$REDIS_PASSWORD"
    volumes:
    - dify-redis:/data
    networks:
    - dify
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    image: talent-platform-api:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
    restart: unless-stopped
    init: true
    environment:
      MYSQL_URL: mysql+asyncmy://talent:${MYSQL_PASSWORD}@mysql:3306/talent
      POSTGRES_URL: postgresql+asyncpg://talent_analytics:${ANALYTICS_PASSWORD}@postgres:5432/talent_analytics
      CHECKPOINT_DATABASE_URL: postgresql://talent_checkpoint:${CHECKPOINT_PASSWORD}@postgres:5432/talent_checkpoint
      ANALYSIS_DATABASE_URL: postgresql://talent_readonly:${ANALYSIS_PASSWORD}@postgres:5432/talent_analytics
      MYSQL_ANALYSIS_URL: mysql+pymysql://talent_readonly:${MYSQL_ANALYSIS_PASSWORD}@mysql:3306/talent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_URL: http://milvus:19530
      OLLAMA_URL: http://model-gateway:11434
      DIFY_API_URL: http://dify-api:5001/v1
      DIFY_APP_KEY: ${DIFY_APP_KEY:-}
      DIFY_APP_ID: ${DIFY_APP_ID:-}
      DIFY_WORKFLOW_HASH: ${DIFY_WORKFLOW_HASH:-}
      CHAT_MODEL_DIGEST: ${CHAT_MODEL_DIGEST:-}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-}
      PROMPT_VERSION: ${PROMPT_VERSION:-local-v2}
      DIFY_DATASET_KEY: ${DIFY_DATASET_KEY:-}
      DIFY_CONSOLE_URL: http://127.0.0.1:18081
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: '1024'
      PARSER_URL: http://mineru:8001
      DIFY_PUBLIC_URL: http://127.0.0.1:18081
      MINERU_URL: http://mineru:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?initialize configuration}
      JWT_SECRET: ${JWT_SECRET:?initialize configuration}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?initialize configuration}
      DATA_DIR: /data
      AI_SERVICE_URL: http://ai:8001
      ANALYTICS_SERVICE_URL: http://analytics:8002
      LANGCHAIN_TRACING_V2: 'false'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
    - app-data:/data
    - ./infra:/bootstrap:ro
    networks:
      data:
        aliases:
        - platform-api
      application: {}
    command:
    - uvicorn
    - talent_platform.api:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-access-log
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=5)
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 12
  ai:
    image: talent-platform-api:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
    restart: unless-stopped
    init: true
    environment:
      MYSQL_URL: mysql+asyncmy://talent:${MYSQL_PASSWORD}@mysql:3306/talent
      POSTGRES_URL: postgresql+asyncpg://talent_analytics:${ANALYTICS_PASSWORD}@postgres:5432/talent_analytics
      CHECKPOINT_DATABASE_URL: postgresql://talent_checkpoint:${CHECKPOINT_PASSWORD}@postgres:5432/talent_checkpoint
      ANALYSIS_DATABASE_URL: postgresql://talent_readonly:${ANALYSIS_PASSWORD}@postgres:5432/talent_analytics
      MYSQL_ANALYSIS_URL: mysql+pymysql://talent_readonly:${MYSQL_ANALYSIS_PASSWORD}@mysql:3306/talent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_URL: http://milvus:19530
      OLLAMA_URL: http://model-gateway:11434
      DIFY_API_URL: http://dify-api:5001/v1
      DIFY_APP_KEY: ${DIFY_APP_KEY:-}
      DIFY_APP_ID: ${DIFY_APP_ID:-}
      DIFY_WORKFLOW_HASH: ${DIFY_WORKFLOW_HASH:-}
      CHAT_MODEL_DIGEST: ${CHAT_MODEL_DIGEST:-}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-}
      PROMPT_VERSION: ${PROMPT_VERSION:-local-v2}
      DIFY_DATASET_KEY: ${DIFY_DATASET_KEY:-}
      DIFY_CONSOLE_URL: http://127.0.0.1:18081
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: '1024'
      PARSER_URL: http://mineru:8001
      DIFY_PUBLIC_URL: http://127.0.0.1:18081
      MINERU_URL: http://mineru:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?initialize configuration}
      JWT_SECRET: ${JWT_SECRET:?initialize configuration}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?initialize configuration}
      DATA_DIR: /data
      AI_SERVICE_URL: http://ai:8001
      ANALYTICS_SERVICE_URL: http://analytics:8002
      LANGCHAIN_TRACING_V2: 'false'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
    - app-data:/data
    - ./infra:/bootstrap:ro
    networks:
    - data
    - application
    command:
    - uvicorn
    - talent_platform.ai_service:app
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    - --no-access-log
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health',timeout=5)
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 12
  analytics:
    image: talent-platform-api:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
    restart: unless-stopped
    init: true
    environment:
      MYSQL_URL: mysql+asyncmy://talent:${MYSQL_PASSWORD}@mysql:3306/talent
      POSTGRES_URL: postgresql+asyncpg://talent_analytics:${ANALYTICS_PASSWORD}@postgres:5432/talent_analytics
      CHECKPOINT_DATABASE_URL: postgresql://talent_checkpoint:${CHECKPOINT_PASSWORD}@postgres:5432/talent_checkpoint
      ANALYSIS_DATABASE_URL: postgresql://talent_readonly:${ANALYSIS_PASSWORD}@postgres:5432/talent_analytics
      MYSQL_ANALYSIS_URL: mysql+pymysql://talent_readonly:${MYSQL_ANALYSIS_PASSWORD}@mysql:3306/talent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_URL: http://milvus:19530
      OLLAMA_URL: http://model-gateway:11434
      DIFY_API_URL: http://dify-api:5001/v1
      DIFY_APP_KEY: ${DIFY_APP_KEY:-}
      DIFY_APP_ID: ${DIFY_APP_ID:-}
      DIFY_WORKFLOW_HASH: ${DIFY_WORKFLOW_HASH:-}
      CHAT_MODEL_DIGEST: ${CHAT_MODEL_DIGEST:-}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-}
      PROMPT_VERSION: ${PROMPT_VERSION:-local-v2}
      DIFY_DATASET_KEY: ${DIFY_DATASET_KEY:-}
      DIFY_CONSOLE_URL: http://127.0.0.1:18081
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: '1024'
      PARSER_URL: http://mineru:8001
      DIFY_PUBLIC_URL: http://127.0.0.1:18081
      MINERU_URL: http://mineru:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?initialize configuration}
      JWT_SECRET: ${JWT_SECRET:?initialize configuration}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?initialize configuration}
      DATA_DIR: /data
      AI_SERVICE_URL: http://ai:8001
      ANALYTICS_SERVICE_URL: http://analytics:8002
      LANGCHAIN_TRACING_V2: 'false'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
    - app-data:/data
    - ./infra:/bootstrap:ro
    networks:
    - data
    - application
    command:
    - uvicorn
    - talent_platform.analytics_service:app
    - --host
    - 0.0.0.0
    - --port
    - '8002'
    - --no-access-log
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health',timeout=5)
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 12
  worker:
    image: talent-platform-api:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
    restart: unless-stopped
    init: true
    environment:
      MYSQL_URL: mysql+asyncmy://talent:${MYSQL_PASSWORD}@mysql:3306/talent
      POSTGRES_URL: postgresql+asyncpg://talent_analytics:${ANALYTICS_PASSWORD}@postgres:5432/talent_analytics
      CHECKPOINT_DATABASE_URL: postgresql://talent_checkpoint:${CHECKPOINT_PASSWORD}@postgres:5432/talent_checkpoint
      ANALYSIS_DATABASE_URL: postgresql://talent_readonly:${ANALYSIS_PASSWORD}@postgres:5432/talent_analytics
      MYSQL_ANALYSIS_URL: mysql+pymysql://talent_readonly:${MYSQL_ANALYSIS_PASSWORD}@mysql:3306/talent
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_URL: http://milvus:19530
      OLLAMA_URL: http://model-gateway:11434
      DIFY_API_URL: http://dify-api:5001/v1
      DIFY_APP_KEY: ${DIFY_APP_KEY:-}
      DIFY_APP_ID: ${DIFY_APP_ID:-}
      DIFY_WORKFLOW_HASH: ${DIFY_WORKFLOW_HASH:-}
      CHAT_MODEL_DIGEST: ${CHAT_MODEL_DIGEST:-}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-}
      PROMPT_VERSION: ${PROMPT_VERSION:-local-v2}
      DIFY_DATASET_KEY: ${DIFY_DATASET_KEY:-}
      DIFY_CONSOLE_URL: http://127.0.0.1:18081
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: '1024'
      PARSER_URL: http://mineru:8001
      DIFY_PUBLIC_URL: http://127.0.0.1:18081
      MINERU_URL: http://mineru:8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?initialize configuration}
      JWT_SECRET: ${JWT_SECRET:?initialize configuration}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?initialize configuration}
      DATA_DIR: /data
      AI_SERVICE_URL: http://ai:8001
      ANALYTICS_SERVICE_URL: http://analytics:8002
      LANGCHAIN_TRACING_V2: 'false'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
    - app-data:/data
    - ./infra:/bootstrap:ro
    networks:
    - data
    - application
    command:
    - python
    - -m
    - talent_platform.worker
    depends_on:
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
      analytics:
        condition: service_healthy
  model-gateway:
    image: talent-platform-gateway:0.2.0
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
    restart: unless-stopped
    environment:
      OLLAMA_UPSTREAM: http://host.docker.internal:11434
      MODEL_MAX_PENDING: '64'
      MODEL_QUEUE_TIMEOUT: '900'
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - data
    - dify
    - egress
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:11434/health',timeout=5)
      interval: 20s
      timeout: 5s
      retries: 10
  web:
    image: talent-platform-web:0.2.0
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        HTTP_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${BUILD_PROXY:-http://host.docker.internal:7897}
    restart: unless-stopped
    ports:
    - 127.0.0.1:18080:8080
    networks:
    - application
    depends_on:
      api:
        condition: service_healthy
  dify-init-permissions:
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    command:
    - sh
    - -c
    - "FLAG_FILE=\"/app/api/storage/.init_permissions\"\nif [ -f \"$${FLAG_FILE}\"\
      \ ]; then\n  echo \"Permissions already initialized. Exiting.\"\n  exit 0\n\
      fi\necho \"Initializing permissions for /app/api/storage\"\nchown -R 1001:1001\
      \ /app/api/storage && touch \"$${FLAG_FILE}\"\necho \"Permissions initialized.\
      \ Exiting.\"\n"
    restart: 'no'
    networks:
    - dify
    environment: {}
    volumes:
    - dify-storage:/app/api/storage
  dify-api:
    restart: unless-stopped
    image: langgenius/dify-api:1.17.1@sha256:ceede5b903afaa20348f7ad80ebf847379dc56d886a99b9ec6a08913dacd7732
    environment:
      MODE: api
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${API_SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_PROFILES_SAMPLE_RATE: ${API_SENTRY_PROFILES_SAMPLE_RATE:-1.0}
      PLUGIN_REMOTE_INSTALL_HOST: ${EXPOSE_PLUGIN_DEBUGGING_HOST:-localhost}
      PLUGIN_REMOTE_INSTALL_PORT: ${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      PLUGIN_DAEMON_TIMEOUT: ${PLUGIN_DAEMON_TIMEOUT:-600.0}
