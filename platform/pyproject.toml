[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-platform"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn", "pydantic", "pydantic-settings", "sqlalchemy[asyncio]>=2,<2.1",
  "asyncmy", "asyncpg", "aiosqlite", "httpx", "redis", "PyJWT", "argon2-cffi",
  "python-multipart", "langchain-core>=1,<2", "langchain-ollama>=1,<2", "langchain-text-splitters==1.1.3", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres", "pymilvus>=2.6,<2.7", "sqlglot", "vanna>=2,<3",
  "python-docx", "reportlab", "openpyxl", "xlrd", "numpy", "pandas", "pypdf", "PyMySQL",
  "psycopg[binary,pool]", "jsonschema", "cryptography", "PyYAML",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
