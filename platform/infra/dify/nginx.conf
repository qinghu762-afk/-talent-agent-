server {
 listen 80;
 server_name _;
 client_max_body_size 100m;
 proxy_read_timeout 1800s;
 proxy_send_timeout 1800s;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 location /console/api/ { proxy_pass http://dify-api:5001; proxy_buffering off; }
 location /api/ { proxy_pass http://dify-api:5001; proxy_buffering off; }
 location /v1/ { proxy_pass http://dify-api:5001; proxy_buffering off; }
 location /files/ { proxy_pass http://dify-api:5001; }
 location /e/ { proxy_pass http://dify-plugin-daemon:5002; }
 location /socket.io { proxy_pass http://dify-api-websocket:5001; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
 location / { proxy_pass http://dify-web:3000; }
}
