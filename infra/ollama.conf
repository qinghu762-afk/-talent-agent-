resolver 127.0.0.11 valid=30s ipv6=off;
log_format private_model_access '$remote_addr $request_method $uri $status $body_bytes_sent';
upstream windows_ollama {
    zone windows_ollama 64k;
    server host.docker.internal:11434 resolve;
    keepalive 8;
}
server {
    listen 11434;
    server_tokens off;
    access_log /var/log/nginx/access.log private_model_access;
    client_max_body_size 64m;
    location ~ ^/api/(tags|show|embed|embeddings|chat|ps)$ {
        proxy_pass http://windows_ollama;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_connect_timeout 10s;
        proxy_read_timeout 960s;
        proxy_buffering off;
    }
    location / { return 403; }
}
